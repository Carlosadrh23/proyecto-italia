<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeaway - Tipo de Propiedad</title>

    <link rel="stylesheet" href="../assets/styles.css?v=1">
</head>

<body class="pagina-tipo-propiedad">

    <div class="seccion-izquierda">

        <div class="logo-container">

            <img src="../assets/img/Logo_blanco.png"
                 alt="HomeAway Logo"
                 class="logo-login">

        </div>

    </div>

    <div class="container paso-1">

        <button class="back-button"
                onclick="window.location.href='Index.php'">
            ←
        </button>

        <h1>
            ¿Cuál de estas opciones describe mejor tu alojamiento?
        </h1>

        <p class="subtitle">
            Selecciona el tipo de propiedad que vas a ofrecer
        </p>

        <div class="options">

            <button class="option-button"
                    data-tipo="casa">
                Casa
            </button>

            <button class="option-button"
                    data-tipo="departamento">
                Departamento
            </button>

            <button class="option-button"
                    data-tipo="condominio">
                Condominio
            </button>

        </div>

    </div>

    <script src="../assets/javascript/main.js?v=1"></script>

    <script>

    // VERIFICAR SESIÓN
    document.addEventListener('DOMContentLoaded', async function () {

        try {

            const response = await fetch(
                '../app/AuthController.php',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        accion: 'verificar_sesion'
                    })
                }
            );

            const resultado = await response.json();

            // SI NO ESTÁ LOGUEADO
            if (!resultado.logueado) {

                alert(
                    'Debes iniciar sesión para convertirte en anfitrión'
                );

                // GUARDAR REDIRECCIÓN
                sessionStorage.setItem(
                    'redirigir_anfitrion',
                    'true'
                );

                // IR AL LOGIN
                window.location.href = 'Login.html';

                return;
            }

            console.log('Usuario logueado');

            // CARGAR DATOS GUARDADOS
            cargarDatosGuardados();

        } catch (error) {

            console.error(error);

            alert('Error verificando sesión');

            window.location.href = 'Login.html';
        }
    });

    // CARGAR DATOS
    function cargarDatosGuardados() {

        const datosPropiedad =
            JSON.parse(
                sessionStorage.getItem('datosPropiedad') || '{}'
            );

        if (datosPropiedad.tipoAlojamiento) {

            const botones =
                document.querySelectorAll('.option-button');

            botones.forEach(boton => {

                if (
                    boton.getAttribute('data-tipo')
                    === datosPropiedad.tipoAlojamiento
                ) {

                    boton.classList.add('selected');
                }
            });
        }
    }

    // BOTONES
    const botones =
        document.querySelectorAll('.option-button');

    botones.forEach(boton => {

        boton.addEventListener('click', function () {

            const tipoSeleccionado =
                this.getAttribute('data-tipo');

            const datosPropiedad =
                JSON.parse(
                    sessionStorage.getItem('datosPropiedad') || '{}'
                );

            // GUARDAR
            datosPropiedad.tipoAlojamiento =
                tipoSeleccionado;

            sessionStorage.setItem(
                'datosPropiedad',
                JSON.stringify(datosPropiedad)
            );

            console.log(datosPropiedad);

            
            window.location.href =
                'Anfitrion2.html';
        });
    });

    </script>

</body>
</html>
